services:
  - type: web
    name: adez-md-whatsapp-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_NAME
        value: ADEZ MD
      - key: BOT_PREFIX
        value: /
      - key: OWNER_NAME
        value: ADEZ MD Team
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 10000
    disk:
      name: whatsapp-auth
      mountPath: /opt/render/project/src/.auth_info_baileys
      sizeGB: 1
